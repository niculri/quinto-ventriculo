# The CI: types, lint, ratchets, knip, format and Vitest; the end to end tests in Chromium and WebKit; the build.
name: CI

on:
  # The same list as CI_IGNORED_PATHS in packages/ops/src/deploy.ts: none of these goes into the build or a test.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '.claude/**', '*.md']
  # Before 4:00 in Chile all year (UTC−3 and UTC−4), when the site's day starts and hour-dependent tests could fail.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  # By event: a nightly run must not cancel the push run of the same commit, which npm run deploy needs green.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, format and tests
    runs-on: ubuntu-latest
    steps:
      # Without the private repository, the checks of the real material are skipped (the pre-push hook runs them).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Compared with the push's or pull request's base; the nightly run and a run by hand compare with themselves.
      - name: Ratchets (lint suppressions, import cycles and test names)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=HEAD
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base=FETCH_HEAD
          fi
          npm run --silent suppressions -- --base "$base"
          npm run --silent deps -- --base "$base"
          npm run --silent test-names -- --base "$base"
      # knip loads vite.config.ts, which refuses to run in production mode without the users' URL.
      - run: npm run knip
        env:
          VITE_USERS_SUPABASE_URL: https://example.supabase.co
          VITE_USERS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      - run: npm run format:check
      - run: npm test

  e2e:
    name: End to end (Playwright, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --project=desktop --project=phone --shard=${{ matrix.shard }}/3
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # A job of its own, so that it runs beside Chromium's and the CI does not take longer.
  e2e-iphone:
    name: End to end (iPhone, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
        working-directory: apps/web
      - run: npx playwright test --project=iphone
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-iphone
          path: apps/web/test-results
          retention-days: 7

  build:
    name: Build the web and the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USERS_SUPABASE_URL: https://example.supabase.co
          VITE_USERS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      - run: npx wrangler deploy --dry-run --outdir dist-worker
        working-directory: apps/api
