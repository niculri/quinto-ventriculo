name: Deploy

# Publishes the web and the API to Cloudflare on every push to main, once CI passed.
# It is enabled by creating the repository variable DEPLOY = yes (see docs/configuracion.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a push to main of this same repository. A pull request from a fork whose branch is called «main»
    # also triggers CI with head_branch = main, and without these conditions its code would be deployed with
    # the Cloudflare secrets. The nightly CI (`schedule`) and a CI run by hand (`workflow_dispatch`) also trigger
    # this workflow when they finish, with head_branch = main: event == 'push' keeps them from deploying (step 1.9;
    # checked by packages/ops/src/workflows.test.ts).
    if: >-
      vars.DEPLOY == 'yes' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USERS_SUPABASE_URL: ${{ vars.USERS_SUPABASE_URL }}
          VITE_USERS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.USERS_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
