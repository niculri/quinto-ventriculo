# Publishes the web and the API to Cloudflare after a green CI of a push to main, if the variable DEPLOY is «yes».
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A fork's pull request from a branch called «main», the nightly CI and a CI run by hand also finish with
    # head_branch = main: only a push of this same repository may deploy with the Cloudflare secrets.
    if: >-
      vars.DEPLOY == 'yes' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USERS_SUPABASE_URL: ${{ vars.USERS_SUPABASE_URL }}
          VITE_USERS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.USERS_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
